# VueCalc Calculator Application Configuration (v6 M2)
#
# 此文件支持独立 AOT 编译:
#   cd <框架根>
#   <swoole_compile*>/swoole_compiler.exe apps/calculator/project.yml -f
#
# sources 路径相对于本文件所在目录 (apps/calculator/)
name: calculator
version: 1.0.0
mode: bin
no-console: false
sources:
  # 应用代码
  - main.php

  - ./gen
  # 框架运行时 (构建工具 compiler/ 不在此列)
  - ../../framework/Application.php
  - ../../framework/VNode.php
  - ../../framework/VNodeRenderer.php
  - ../../framework/LayoutResolver.php
  - ../../framework/interfaces/ComponentInterface.php
  - ../../framework/BaseComponent.php
  - ../../framework/ReactiveComponent.php
  - ../../framework/ChangeQueue.php
  - ../../framework/FocusManager.php
  - ../../framework/compiler/css-mappings.php
  - ../../framework/rendering/RenderContext.php
  - ../../framework/rendering/GdiRenderContext.php
  # C++ 桥接层
  - ../../stub
  - ../../cpp

